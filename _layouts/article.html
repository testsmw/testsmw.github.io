---
layout: default
---
<article>
  <p>{{ page.section }}</p>
  <h1>{{ page.title }}</h1>

  {% if page.summary %}
  <p>{{ page.summary }}</p>
  {% endif %}

  {% if page.updated %}
  <p>内容確認日: {{ page.updated }}</p>
  {% endif %}

  <hr>
  <p>--- 本文開始 ---</p>

  <div>
    {{ content }}
  </div>

  <p>--- 本文終了 ---</p>
</article>
